<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Staffing Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a planning board — a fixed info column on the left, one shared calendar track on the right,
   month lines and study-period bands running through every row so all courses and people line up in time. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --ink: #131820;
  --ink-2: #4a5362;
  --muted: #7b8494;
  --line: #dfe3ea;
  --line-2: #c9cfd9;
  --accent: #1d5c8f;
  --accent-soft: #dce9f5;
  --ok: #1f7a4f; --ok-bg: #e2f3ea;
  --warn: #9a6200; --warn-bg: #fbefd6;
  --crit: #b3352f; --crit-bg: #fae3e1;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --s9: #8a919c;
  --h0: #eef1f5; --h1: #cde2fb; --h2: #9ec5f4; --h3: #5598e7; --h4: #2a78d6; --h5: #184f95;
  --band: rgba(29, 92, 143, 0.045);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --info-w: clamp(178px, 27vw, 300px);
  --track-min: 760px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1319; --surface: #161b23; --surface-2: #1d232d; --ink: #e9edf3; --ink-2: #b1b9c6; --muted: #848d9b;
    --line: #262d38; --line-2: #343c49; --accent: #7cb4e6; --accent-soft: #1c3249;
    --ok: #5fc792; --ok-bg: #173226; --warn: #e6b04f; --warn-bg: #3a2c12; --crit: #ef7d76; --crit-bg: #3d1d1b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s9: #737b87;
    --h0: #1d232d; --h1: #13355e; --h2: #1c5cab; --h3: #2a78d6; --h4: #5598e7; --h5: #9ec5f4;
    --band: rgba(124, 180, 230, 0.05);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1319; --surface: #161b23; --surface-2: #1d232d; --ink: #e9edf3; --ink-2: #b1b9c6; --muted: #848d9b;
  --line: #262d38; --line-2: #343c49; --accent: #7cb4e6; --accent-soft: #1c3249;
  --ok: #5fc792; --ok-bg: #173226; --warn: #e6b04f; --warn-bg: #3a2c12; --crit: #ef7d76; --crit-bg: #3d1d1b;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s9: #737b87;
  --h0: #1d232d; --h1: #13355e; --h2: #1c5cab; --h3: #2a78d6; --h4: #5598e7; --h5: #9ec5f4;
  --band: rgba(124, 180, 230, 0.05);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { color-scheme: light; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1500px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* Header */
header.top { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: flex-end; justify-content: space-between; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.brand { min-width: 0; }
.eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 3.2vw, 34px); line-height: 1.05; margin: 4px 0 6px; letter-spacing: -0.015em; text-wrap: balance; }
.source { color: var(--ink-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.source .tag { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--warn-bg); color: var(--warn); }
.source .tag.real { background: var(--ok-bg); color: var(--ok); }
.drop { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 10px 12px 10px 14px; background: var(--surface); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop p { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 34ch; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 7px; padding: 7px 12px; font-weight: 600; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); color: var(--surface); }
.btn.link { border: 0; background: none; padding: 4px 2px; color: var(--accent); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.err { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--crit-bg); color: var(--crit); font-size: 13px; }

/* Summary strip */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 18px 0; }
.kpi { background: var(--surface); padding: 12px 14px; min-width: 0; }
.kpi .k { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.kpi .v { font-family: var(--font-data); font-size: 21px; font-weight: 500; margin-top: 2px; }
.kpi .s { font-size: 12px; color: var(--ink-2); }
.kpi.alert .v { color: var(--crit); }
.kpi button.s { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* Controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 12px; }
.tabs { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: none; padding: 7px 14px; border-radius: 7px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.field { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.field input[type="search"], .field select { border: 1px solid var(--line-2); background: var(--surface); border-radius: 7px; padding: 6px 9px; min-width: 0; }
.field input[type="search"] { width: 220px; max-width: 60vw; }
.spacer { flex: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin: 0 0 10px; align-items: center; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
.legend .heat { display: inline-flex; gap: 2px; margin: 0 4px; vertical-align: -1px; }
.legend .heat i { width: 16px; height: 10px; border-radius: 2px; display: inline-block; }

/* Timeline board */
.board { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.scroller { overflow-x: auto; }
.tl { position: relative; min-width: calc(var(--info-w) + var(--track-min)); }
.grid-layer { position: absolute; top: 0; bottom: 0; left: var(--info-w); right: 0; pointer-events: none; }
.grid-layer .pband { position: absolute; top: 0; bottom: 0; background: var(--band); }
.grid-layer .mline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.row { display: grid; grid-template-columns: var(--info-w) 1fr; position: relative; }
.row > .info { position: sticky; left: 0; z-index: 2; background: var(--surface); border-right: 1px solid var(--line); padding: 10px 12px 10px 14px; min-width: 0; }
.row > .track { position: relative; min-width: 0; }
.axis { border-bottom: 1px solid var(--line); }
.axis .info { font-size: 11px; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; display: flex; align-items: flex-end; padding-block: 8px; }
.axis .track { height: 46px; }
.axis .plabel { position: absolute; top: 6px; font-size: 11px; font-weight: 600; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 6px; }
.axis .mlabel { position: absolute; bottom: 6px; font-size: 11px; color: var(--ink-2); padding-left: 5px; white-space: nowrap; }
.axis .mlabel b { font-weight: 600; color: var(--ink); }
.sec-head { background: var(--surface-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.sec-head > .info { background: var(--surface-2); padding-block: 8px; display: flex; gap: 8px; align-items: center; }
.sec-head .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.sec-head .t { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec-head .track { display: flex; align-items: center; padding-left: 10px; font-size: 12px; color: var(--ink-2); gap: 14px; }

.crow { border-bottom: 1px solid var(--line); }
.crow:hover > .info, .prow:hover > .info { background: var(--surface-2); }
.crow > .info { cursor: pointer; }
.crow .code { font-family: var(--font-data); font-size: 12px; font-weight: 500; color: var(--ink-2); }
.crow .cname { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; margin-top: 2px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.crit { background: var(--crit-bg); color: var(--crit); }
.pill.none { background: var(--surface-2); color: var(--muted); }
.pill svg { width: 10px; height: 10px; }
.crow .track { padding-block: 10px; min-height: 64px; }
.bar { position: absolute; top: 10px; height: 24px; border-radius: 4px; background: color-mix(in oklab, var(--sc) 20%, var(--surface)); border-left: 3px solid var(--sc); display: flex; align-items: center; gap: 6px; padding: 0 7px; font-size: 12px; color: var(--ink); overflow: hidden; white-space: nowrap; cursor: pointer; }
.bar .fill { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--sc); opacity: .9; }
.bar .d { color: var(--ink-2); font-family: var(--font-data); font-size: 11px; }
.team { display: flex; flex-wrap: wrap; gap: 4px; }
.team.right { justify-content: flex-end; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; padding: 2px 7px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--accent); }
.chip .n { font-weight: 600; }
.chip .p, .chip .h { font-family: var(--font-data); font-size: 11px; color: var(--ink-2); }
.chip .h { color: var(--ink); }
.chip .cc { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); align-self: center; }
.chip.zero { opacity: .6; }
.chip.open { border-style: dashed; border-color: var(--warn); background: var(--warn-bg); color: var(--warn); cursor: default; }
.chip.open .p, .chip.open .h { color: var(--warn); }
.chip.asst { background: var(--surface-2); }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0%, 30% { box-shadow: inset 0 0 0 2px var(--accent); } 100% { box-shadow: inset 0 0 0 2px transparent; } }

.detail { grid-column: 1 / -1; position: sticky; left: 0; width: min(100%, 100vw - 32px); background: var(--surface-2); border-top: 1px dashed var(--line-2); padding: 12px 14px 14px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px 28px; }
.detail table { border-collapse: collapse; width: 100%; font-size: 13px; }
.detail th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 4px 8px 6px 0; border-bottom: 1px solid var(--line-2); }
.detail td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.detail td.r, .detail th.r { text-align: right; }
.detail tfoot td { font-weight: 600; border-bottom: 0; }
.detail dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.detail .comment { grid-column: 1 / -1; font-size: 13px; padding: 8px 10px; border-left: 3px solid var(--line-2); background: var(--surface); border-radius: 0 6px 6px 0; }
.share { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--line); vertical-align: middle; margin-right: 6px; overflow: hidden; }
.share i { display: block; height: 100%; background: var(--accent); }

/* People */
.prow { border-bottom: 1px solid var(--line); }
.prow > .info { cursor: pointer; }
.prow .pname { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.prow .pname span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .tot { font-family: var(--font-data); font-weight: 500; white-space: nowrap; }
.meter { height: 6px; border-radius: 3px; background: var(--line); margin: 6px 0 4px; position: relative; overflow: hidden; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; }
.prow .track { padding-block: 8px 10px; }
.heat { position: relative; height: 12px; margin-bottom: 6px; }
.heat .w { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.lane { position: relative; height: 22px; margin-bottom: 3px; }
.lane .bar { top: 0; height: 22px; font-size: 11.5px; }
.lane .bar.co { background: transparent; border: 1px dashed var(--sc); border-left: 3px solid var(--sc); }
.dept .info h3 { margin: 0; font-size: 13px; }
.dept .info p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.dept .track { height: 140px; }
.colbar { position: absolute; bottom: 22px; background: var(--accent); border-radius: 3px 3px 0 0; opacity: .85; }
.colbar:hover { opacity: 1; }
.ygrid { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line-2); font-size: 10px; color: var(--muted); font-family: var(--font-data); }
.ygrid span { position: absolute; right: 4px; top: -14px; background: var(--surface); padding: 0 3px; }
.hit { position: absolute; top: 0; bottom: 0; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }

#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.4; padding: 7px 9px; border-radius: 6px; max-width: 300px; white-space: pre-line; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
#tip b { font-weight: 600; }
.foot { margin-top: 16px; font-size: 12px; color: var(--muted); max-width: 90ch; }
.foot p { margin: 0 0 6px; }
@media (max-width: 720px) {
  .detail { grid-template-columns: 1fr; }
  .drop p { max-width: none; }
}
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Teaching staffing · calendar year view</div>
      <h1 id="title">Course Staffing Year</h1>
      <div class="source" id="source"></div>
    </div>
    <div class="drop" id="drop">
      <p>Drop the staffing workbook (.xlsx) here. It is read in your browser and is not uploaded anywhere.</p>
      <label class="btn primary" for="file">Choose file…</label>
      <input type="file" id="file" accept=".xlsx,.xlsm,.xls" hidden>
      <button class="btn link" id="sample" type="button" hidden>Show example data</button>
      <a class="btn link" href="example-staffing-2027.xlsx" download>Example workbook</a>
    </div>
  </header>
  <div class="err" id="err" hidden></div>

  <section class="kpis" id="kpis" aria-label="Summary"></section>

  <div class="controls">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-courses" aria-selected="true" data-view="courses">Courses</button>
      <button role="tab" id="tab-people" aria-selected="false" data-view="people">People</button>
    </div>
    <label class="field"><span>Search</span><input type="search" id="q" placeholder="Course, code or person"></label>
    <label class="field"><span>Programme</span><select id="sec"></select></label>
    <span class="spacer"></span>
    <label class="field" id="f-attn"><input type="checkbox" id="attn"> Needs attention only</label>
    <label class="field"><span>Sort</span><select id="sort"></select></label>
  </div>
  <div class="legend" id="legend"></div>
  <div class="board"><div class="scroller"><div class="tl" id="board"></div></div></div>
  <div class="foot" id="foot"></div>
</div>
<div id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
